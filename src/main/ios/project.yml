name: AI
options:
  bundleIdPrefix: com.explore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AI:
    type: application
    platform: iOS
    sources:
      - path: AI
    info:
      path: AI/Info.plist
      properties:
        CFBundleDisplayName: AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Explore AI needs the microphone for voice chat with Qwen ASR.
        NSLocalNetworkUsageDescription: Explore AI talks to your Mac’s local explore-ai and explore-iam services on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: explore-ai-iam
            CFBundleURLSchemes:
              - com.explore.ai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.explore.ai
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: PVXT4ZZ49P
        CODE_SIGN_STYLE: Automatic
  AITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AITests
    dependencies:
      - target: AI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.explore.ai.tests
        DEVELOPMENT_TEAM: PVXT4ZZ49P
