# Render Blueprint — production backend (Free)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: explore-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60.0"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: openai
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_BASE_URL
        value: https://api.openai.com/v1
      - key: TTS_API_KEY
        sync: false
      - key: LAUNCHDARKLY_ENABLED
        value: "true"
      - key: LAUNCHDARKLY_SDK_KEY
        sync: false
      - key: METRICS_ADMIN_API_KEY
        sync: false
      - key: APP_BILLING_PLAN
        value: free
